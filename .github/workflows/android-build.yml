name: Build Android & Wear OS APKs

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Configure Permanent Fixed Android Debug Keystore (Constant SHA-1 across all builds)
        env:
          CUSTOM_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          DEFAULT_FIXED_KEYSTORE_B64: ""
        run: |
          mkdir -p ~/.android
          if [ -n "$CUSTOM_KEYSTORE_B64" ]; then
            echo "$CUSTOM_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          else
            echo "$DEFAULT_FIXED_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          fi
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey

      - name: Assemble Mobile, Wear OS and Watch Face APKs
        run: gradle :mobile:assembleDebug :wear:assembleDebug :watchface:assembleDebug --stacktrace

      - name: Upload Smartphone APK (:mobile)
        uses: actions/upload-artifact@v4
        with:
          name: chronowear-mobile-apk
          path: mobile/build/outputs/apk/debug/*.apk

      - name: Upload Wear OS Companion APK (:wear)
        uses: actions/upload-artifact@v4
        with:
          name: chronowear-wear-apk
          path: wear/build/outputs/apk/debug/*.apk

      - name: Upload WFF Watch Face APK (:watchface)
        uses: actions/upload-artifact@v4
        with:
          name: chronowear-watchface-wff-apk
          path: watchface/build/outputs/apk/debug/*.apk
